[mgr]
sort_by = "extension"
sort_sensitive = false
sort_dir_first = true
linemode = "mtime"
show_symlink = true

[preview]
# Keep Kitty-graphics previews small enough for Ghostty to render without clipping.
max_width = 800
max_height = 500

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
  { run = "nvim %*", block = true, for = "windows" },
]
