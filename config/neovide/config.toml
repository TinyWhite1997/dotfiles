fork = true
full = "buttonless"
title_hidden = true

[font]
normal = [ "FiraCode Nerd Font" ]
size = 16.0

[font.features]
"FiraCode Nerd Font" = [ "+cv06", "+cv12", "+cv14", "+cv16", "+cv25", "+cv26", "+cv28", "+cv29", "+cv31", "+cv32", "+ss03", "+ss04", "+ss05", "+ss07", "+ss09" ]

[[font.bold]]
family = "Monaspace Krypton Var"
style = "Bold"

[[font.italic]]
family = "Monaspace Radon Var"
style = "Italic"
