- link:
    D:/.config/:
      glob: true
      path: config/*
      relink: true
      create: true
    D:/.zsh/:
      glob: true
      path: zsh/*
      relink: true
      create: true
      exclude: [ zsh/zshrc, zsh/zimrc ]
    D:/.zshrc:
      path: zsh/zshrc
      force: true
    D:/.zimrc:
      path: zsh/zimrc
      force: true
    D:/.copilot/copilot-instructions.md:
      path: copilot/copilot-instructions.md
      relink: true
      create: true
    D:/.pi/agent/extensions/:
      glob: true
      path: pi/agent/extensions/*
      force: true
      create: true
    D:/.zsh/fzf-tab:
      path: fzf-tab
      relink: true
    D:/.config/yazi/flavors:
      path: flavors
      relink: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
