id = "pi.popup"
name = "Pi popup"
version = "0.1.0"
min_herdr_version = "0.8.0"
platforms = ["macos", "linux", "windows"]
description = "Open a Pi command in a Herdr floating popup."

[[panes]]
id = "run"
title = "pi"
platforms = ["macos", "linux"]
placement = "popup"
width = "90%"
height = "90%"
command = ["node", "-e", "require(process.env.PI_HERDR_POPUP_RUNNER)"]

[[panes]]
id = "run-windows"
title = "pi"
platforms = ["windows"]
placement = "popup"
width = "90%"
height = "90%"
command = ["node.exe", "-e", "require(process.env.PI_HERDR_POPUP_RUNNER)"]
