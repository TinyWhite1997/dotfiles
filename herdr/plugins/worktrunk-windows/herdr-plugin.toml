id = "worktrunk.windows"
name = "Worktrunk (Windows)"
version = "0.2.0"
min_herdr_version = "0.8.0"
description = "Switch, create, or remove worktrees through Worktrunk on Windows."
platforms = ["windows"]

[[panes]]
id = "picker"
title = "Worktree"
placement = "popup"
width = "80%"
height = "60%"
command = [
  "powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''try { & $env:WORKTRUNK_HERDR_RUNNER; $s=0 } catch { Write-Error $_; $s=1 }; if($s){Read-Host 'Press Enter to close'}; exit $s''',
]

[[actions]]
id = "open"
title = "Worktree: switch / create"
contexts = ["workspace"]
command = [
  "powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $h=$env:HERDR_BIN_PATH; if(-not $h){$h='herdr'}; $p=((& $h plugin list --json|ConvertFrom-Json).result.plugins|Where-Object {$_.plugin_id -eq 'worktrunk.windows'}|Select-Object -First 1).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') -Mode default''',
]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
command = [
  "powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $h=$env:HERDR_BIN_PATH; if(-not $h){$h='herdr'}; $p=((& $h plugin list --json|ConvertFrom-Json).result.plugins|Where-Object {$_.plugin_id -eq 'worktrunk.windows'}|Select-Object -First 1).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') -Mode current''',
]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
command = [
  "powershell.exe", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command",
  '''$u=New-Object System.Text.UTF8Encoding($false); [Console]::OutputEncoding=$u; $OutputEncoding=$u; $h=$env:HERDR_BIN_PATH; if(-not $h){$h='herdr'}; $p=((& $h plugin list --json|ConvertFrom-Json).result.plugins|Where-Object {$_.plugin_id -eq 'worktrunk.windows'}|Select-Object -First 1).plugin_root; if($p -and $p.StartsWith('\\?\')){$p=$p.Substring(4)}; & (Join-Path $p 'scripts\launch.ps1') -Mode remove''',
]
