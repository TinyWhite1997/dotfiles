- link:
    ~/AppData/Local/nvim:
      path: config/nvim
      relink: true
    ~/AppData/Roaming/yazi/config:
      path: config/yazi
      relink: true
    ~/AppData/Roaming/Rime:
      path: Rime
      relink: true
    ~/.copilot/copilot-instructions.md:
      path: copilot/copilot-instructions.md
      relink: true
      create: true
    ~/.pi/agent/extensions/:
      glob: true
      path: pi/agent/extensions/*
      force: true
      create: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [npm install --prefix "%USERPROFILE%/.pi/agent/extensions", Installing Pi extension dependencies]
  - [powershell -NoProfile -File pi/install-packages.ps1, Installing Pi packages]
  - [ln -sfn ../../pi/git-pre-commit .git/hooks/pre-commit, Installing Pi packages git hook]
