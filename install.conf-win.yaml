- link:
    .git/hooks/pre-commit:
      path: pi/git-pre-commit
      relink: true
      create: true
    ~/AppData/Local/nvim:
      path: config/nvim
      relink: true
    ~/AppData/Roaming/yazi/config:
      path: config/yazi
      relink: true
      create: true
    ~/AppData/Roaming/worktrunk/config.toml:
      path: worktrunk/config.toml
      relink: true
      create: true
    ~/AppData/Roaming/nushell/config.nu:
      path: config/nushell/config.nu
      relink: true
      force: true
      create: true
    ~/AppData/Roaming/Rime:
      path: Rime
      relink: true
    ~/.copilot/copilot-instructions.md:
      path: copilot/copilot-instructions.md
      relink: true
      force: true
      create: true
    ~/.pi/agent/AGENTS.md:
      path: pi/agent/AGENTS.md
      relink: true
      create: true
    ~/.pi/agent/skills/:
      glob: true
      path: pi/agent/skills/*
      force: true
      create: true
    ~/.pi/agent/extensions/:
      glob: true
      path: pi/agent/extensions/*
      force: true
      create: true
- shell:
  - ['nu -n -c "zoxide init nushell | save -f ~/.zoxide.nu"', Generating zoxide Nushell integration]
  - ['nu -n -c "git-wt.exe config shell init nu | save -f ~/.worktrunk.nu"', Generating Worktrunk Nushell integration]
  - [git submodule update --init --recursive, Installing submodules]
  - [npm install --prefix "%USERPROFILE%/.pi/agent/extensions", Installing Pi extension dependencies]
  - [powershell -NoProfile -File pi/install-packages.ps1, Installing Pi packages]
