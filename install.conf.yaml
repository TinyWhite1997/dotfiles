- link:
    ~/.config/:
      glob: true
      path: config/*
      relink: true
      create: true
      exclude: [ config/niri, config/fcitx5 ]
    ~/.config/niri/config.kdl:
      path: config/niri/config.kdl
      relink: true
      create: true
    ~/.config/fcitx5/profile:
      path: config/fcitx5/profile
      relink: true
      create: true
    ~/.config/fcitx5/config:
      path: config/fcitx5/config
      relink: true
      create: true
    ~/Library/Rime:
      path: Rime
      relink: true
      if: '[ `uname` = Darwin ]'
    ~/.local/share/fcitx5/rime:
      path: Rime
      relink: true
      create: true
      if: '[ `uname` = Linux ]'
    ~/.zsh/:
      glob: true
      path: zsh/*
      relink: true
      create: true
      exclude: [ zsh/zshrc, zsh/zimrc ]
    ~/.zshrc:
      path: zsh/zshrc
      force: true
    ~/.zimrc:
      path: zsh/zimrc
      force: true
    ~/.hammerspoon:
      path: hammerspoon
      relink: true
    ~/.copilot/copilot-instructions.md:
      path: copilot/copilot-instructions.md
      relink: true
      create: true
    ~/.pi/agent/extensions/:
      glob: true
      path: pi/agent/extensions/*
      force: true
      create: true
    ~/.paseo/config.json:
      path: paseo/config.json
      force: true
      create: true
    ~/.zsh/fzf-tab:
      path: fzf-tab
      relink: true
    ~/.config/yazi/flavors:
      path: flavors
      relink: true
    /etc/keyd/default.conf:
      path: keyd/default.conf
      relink: true
      create: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - [npm install --prefix "$HOME/.pi/agent/extensions", Installing Pi extension dependencies]
