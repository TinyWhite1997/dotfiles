- link:
    ~/.config/:
      glob: true
      path: config/*
      relink: true
      create: true
    ~/Library/Rime:
      path: Rime
      relink: true
      if: '[ `uname` = Darwin ]'
    ~/.local/share/fcitx5/rime:
      path: Rime
      relink: true
      create: true
      if: '[ `uname` = Linux ]'
    ~/.zsh/:
      glob: true
      path: zsh/*
      relink: true
      create: true
      exclude: [ zsh/zshrc, zsh/zimrc ]
    ~/.zshrc:
      path: zsh/zshrc
      force: true
    ~/.zimrc:
      path: zsh/zimrc
      force: true
    ~/.hammerspoon:
      path: hammerspoon
      relink: true
    ~/.zsh/fzf-tab:
      path: fzf-tab
      relink: true
    ~/.config/ghostty/shaders:
      path: ghostty-cursor-shaders
      relink: true
      create: true
    ~/.config/yazi/flavors:
      path: flavors
      relink: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
